<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diretor - CineManager</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body><div class="container"><nav class="navbar"><a class="brand" th:href="@{/}">CineManager</a><a th:href="@{/filmes}">Filmes</a><a th:href="@{/categorias}">Categorias</a><a th:href="@{/diretores}">Diretores</a><a th:href="@{/produtoras}">Produtoras</a><a class="nav-dashboard" th:href="@{/}">Painel</a></nav><main><div class="page-heading"><div><h1 th:text="${diretor.id == null ? 'Novo diretor' : 'Editar diretor'}">Diretor</h1><p>Preencha as informações abaixo.</p></div></div><section class="panel form-panel"><form th:action="@{/diretores/salvar}" th:object="${diretor}" method="post"><input type="hidden" th:field="*{id}"><div class="field"><label for="nome">Nome do diretor</label><input id="nome" type="text" th:field="*{nome}" placeholder="Digite o nome completo" required></div><div class="form-actions"><button class="btn btn-primary" type="submit">Salvar</button><a class="btn btn-light" th:href="@{/diretores}">Cancelar</a></div></form></section></main></div></body></html>
