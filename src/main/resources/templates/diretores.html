<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diretores - CineManager</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="container">

<nav class="navbar">
    <a class="brand" th:href="@{/}">CineManager</a>
    <a th:href="@{/filmes}">Filmes</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/diretores}">Diretores</a>
    <a th:href="@{/produtoras}">Produtoras</a>
    <a th:href="@{/}" class="nav-dashboard">Painel</a>
</nav>
<main>
    <div class="page-heading"><div><h1>Diretores</h1><p>Consulte e gerencie os diretores cadastrados.</p></div><a class="btn btn-primary" th:href="@{/diretores/novo}">Novo diretor</a></div>
    <section class="panel list-panel"><div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Nome</th><th>Ações</th></tr></thead>
        <tbody>
            <tr th:each="item : ${diretores}"><td th:text="${item.id}"></td><td class="main-cell" th:text="${item.nome}"></td>
                <td class="actions"><a class="btn btn-edit" th:href="@{/diretores/editar/{id}(id=${item.id})}">Editar</a><a class="btn btn-delete" th:href="@{/diretores/excluir/{id}(id=${item.id})}" onclick="return confirm('Deseja excluir este registro?')">Excluir</a></td></tr>
            <tr th:if="${#lists.isEmpty(diretores)}"><td colspan="3" class="empty">Nenhum registro cadastrado.</td></tr>
        </tbody>
    </table></div></section>
</main>
</div>
</body>
</html>
