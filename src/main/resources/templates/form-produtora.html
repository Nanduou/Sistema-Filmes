<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtora - CineManager</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>
    <div class="container">

        <nav class="navbar">
            <a class="brand" th:href="@{/}">CineManager</a>
            <a th:href="@{/filmes}">Filmes</a>
            <a th:href="@{/categorias}">Categorias</a>
            <a th:href="@{/diretores}">Diretores</a>
            <a th:href="@{/produtoras}">Produtoras</a>
        </nav>

        <main>
            <div class="page-heading">
                <div>
                    <h1 th:text="${produtora.id == null ? 'Nova produtora' : 'Editar produtora'}">
                        Produtora
                    </h1>
                    <p>Preencha as informações abaixo.</p>
                </div>
            </div>

            <section class="panel form-panel">
                <form th:action="@{/produtoras/salvar}" th:object="${produtora}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="field">
                        <label for="nome">Nome da produtora</label>
                        <input
                            id="nome"
                            type="text"
                            th:field="*{nome}"
                            placeholder="Digite o nome da produtora"
                            required>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-light" th:href="@{/produtoras}">Cancelar</a>
                    </div>

                </form>
            </section>
        </main>

    </div>
</body>

</html>
